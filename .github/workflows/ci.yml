name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Expose Chromium to Lighthouse CI
        run: node -e 'console.log(`CHROME_PATH=${require("@playwright/test").chromium.executablePath()}`)' >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Run component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Run Pa11y accessibility gate
        run: npm run qa:a11y

      - name: Run Lighthouse CI (mobile)
        run: npm run qa:lighthouse:mobile

      - name: Run Lighthouse CI (desktop)
        run: npm run qa:lighthouse:desktop
